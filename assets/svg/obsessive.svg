<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Obsessive position">
<title>Obsessive position</title>
<rect width="1100" height="340" fill="#fffdf8"/>
<text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1420">Obsessive position</text>
<rect x="24.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#2c4a7c" stroke-width="2"/>
<rect x="24.0" y="50" width="251.0" height="8" rx="4" fill="#2c4a7c"/>
<text x="38.0" y="90" font-size="22">📘</text>
<text x="38.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Meaning</text>
<text x="38.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">rules, knowledge, order</text>
<text x="38.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">ambiguity feels like insult</text>
<rect x="291.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#2f6a45" stroke-width="2"/>
<rect x="291.0" y="50" width="251.0" height="8" rx="4" fill="#2f6a45"/>
<text x="305.0" y="90" font-size="22">🪞</text>
<text x="305.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Proof</text>
<text x="305.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">competence, the good child</text>
<text x="305.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">never quite enough</text>
<rect x="558.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#7a2436" stroke-width="2"/>
<rect x="558.0" y="50" width="251.0" height="8" rx="4" fill="#7a2436"/>
<text x="572.0" y="90" font-size="22">⚡</text>
<text x="572.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Trauma</text>
<text x="572.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">loss of control</text>
<text x="572.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">guilt without a named act</text>
<rect x="825.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#5a3d7a" stroke-width="2"/>
<rect x="825.0" y="50" width="251.0" height="8" rx="4" fill="#5a3d7a"/>
<text x="839.0" y="90" font-size="22">💜</text>
<text x="839.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Symptom</text>
<text x="839.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">checking, delay, ritual</text>
<text x="839.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">shield against the Real</text>
</svg>
