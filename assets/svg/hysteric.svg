<text x="839.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Ethical turn</text>
<text x="839.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">produce meaning from inside</text>
