<text x="305.0" y="90" font-size="22">👀</text>
<text x="305.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Proof</text>
<text x="305.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">am I the special object?</text>
<text x="305.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">keep desire open</text>
<rect x="558.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#5a3d7a" stroke-width="2"/>
