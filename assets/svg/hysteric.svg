<text x="572.0" y="90" font-size="22">💜</text>
<text x="572.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Symptom</text>
<text x="572.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">complaint, conversion, riddle</text>
<text x="572.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">Other's desire stays in play</text>
<rect x="825.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#b68a3a" stroke-width="2"/>
