<text x="38.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">Che vuoi? What do you want?</text>
<text x="38.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">being referred to Other</text>
<rect x="291.0" y="50" width="251.0" height="270" rx="8" fill="#fff" stroke="#2f6a45" stroke-width="2"/>
