<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Symptom vs sinthome">
<title>Symptom vs sinthome</title>
<rect width="1100" height="340" fill="#fffdf8"/>
<text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1420">Symptom vs sinthome</text>
<rect x="24.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#5a3d7a" stroke-width="2"/>
<rect x="24.0" y="50" width="340.0" height="8" rx="4" fill="#5a3d7a"/>
<text x="38.0" y="90" font-size="22">💜</text>
<text x="38.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Symptom</text>
<text x="38.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">repeats and hurts</text>
<text x="38.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">protects and enjoys</text>
<text x="38.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">hidden from the official story</text>
<rect x="380.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#b68a3a" stroke-width="2"/>
<rect x="380.0" y="50" width="340.0" height="8" rx="4" fill="#b68a3a"/>
<text x="394.0" y="90" font-size="22">🪢</text>
<text x="394.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Sinthome</text>
<text x="394.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">repetition as a style</text>
<text x="394.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">holds RSI together</text>
<text x="394.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">lack becomes livable</text>
<rect x="736.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#2c4a7c" stroke-width="2"/>
<rect x="736.0" y="50" width="340.0" height="8" rx="4" fill="#2c4a7c"/>
<text x="750.0" y="90" font-size="22">✍️</text>
<text x="750.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Practice</text>
<text x="750.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">writing, craft, love, discipline</text>
<text x="750.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">idiosyncratic on purpose</text>
<text x="750.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">must be fed or it tires</text>
</svg>
