<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="Not synonyms">
<title>Not synonyms</title>
<rect width="1100" height="340" fill="#fffdf8"/>
<text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1420">Not synonyms</text>
<rect x="24.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#2a5f62" stroke-width="2"/>
<rect x="24.0" y="50" width="340.0" height="8" rx="4" fill="#2a5f62"/>
<text x="38.0" y="90" font-size="22">🔁</text>
<text x="38.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Drive (Trieb)</text>
<text x="38.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">circles the hole</text>
<text x="38.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">satisfaction in the loop</text>
<text x="38.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">not a GPS to an object</text>
<rect x="380.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#7a2436" stroke-width="2"/>
<rect x="380.0" y="50" width="340.0" height="8" rx="4" fill="#7a2436"/>
<text x="394.0" y="90" font-size="22">💫</text>
<text x="394.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Desire (Désir)</text>
<text x="394.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">aims at the missing</text>
<text x="394.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">desire of the Other</text>
<text x="394.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">never fully filled</text>
<rect x="736.0" y="50" width="340.0" height="270" rx="8" fill="#fff" stroke="#5a3d7a" stroke-width="2"/>
<rect x="736.0" y="50" width="340.0" height="8" rx="4" fill="#5a3d7a"/>
<text x="750.0" y="90" font-size="22">🔥</text>
<text x="750.0" y="120" font-size="16" font-weight="700" font-family="Georgia, serif" fill="#1c1420">Jouissance</text>
<text x="750.0" y="150" font-size="13" fill="#3a3040" font-family="sans-serif">surplus beyond pleasure</text>
<text x="750.0" y="172" font-size="13" fill="#3a3040" font-family="sans-serif">pain mixed in</text>
<text x="750.0" y="194" font-size="13" fill="#3a3040" font-family="sans-serif">reproduces lack</text>
</svg>
