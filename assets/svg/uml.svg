<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-label="UML model">
<title>UML model</title>
<rect width="1100" height="340" fill="#fffdf8"/>

    <text x="24" y="32" font-family="Georgia, serif" font-size="20" fill="#1c1420">«interface» Subjectivation</text>
    <rect x="40" y="50" width="1020" height="70" rx="8" fill="#fff" stroke="#1c1420" stroke-width="1.5"/>
    <text x="60" y="80" font-size="14" font-family="sans-serif">⚡ Trauma (Real)  →  📘 Meaning (Symbolic)  →  🪞 Proof (Imaginary)  →  💜 Symptom  →  🎯 Existence</text>
    <text x="60" y="102" font-size="12" fill="#3a3040" font-family="sans-serif">Every structure must realize this interface in its own idiom.</text>
    <rect x="40" y="160" width="240" height="140" rx="8" fill="#fff" stroke="#2c4a7c" stroke-width="2"/><text x="56" y="198" font-size="16" font-family="Georgia, serif" fill="#1c1420">🔒 Obsessive</text><text x="56" y="228" font-size="13" fill="#3a3040" font-family="sans-serif">«structure»</text><text x="56" y="258" font-size="13" fill="#3a3040" font-family="sans-serif">rules / delay</text><line x1="160" y1="160" x2="550" y2="120" stroke="#b68a3a" stroke-dasharray="4 4"/><rect x="300" y="160" width="240" height="140" rx="8" fill="#fff" stroke="#7a2436" stroke-width="2"/><text x="316" y="198" font-size="16" font-family="Georgia, serif" fill="#1c1420">❓ Hysteric</text><text x="316" y="228" font-size="13" fill="#3a3040" font-family="sans-serif">«structure»</text><text x="316" y="258" font-size="13" fill="#3a3040" font-family="sans-serif">question / gaze</text><line x1="420" y1="160" x2="550" y2="120" stroke="#b68a3a" stroke-dasharray="4 4"/><rect x="560" y="160" width="240" height="140" rx="8" fill="#fff" stroke="#2f6a45" stroke-width="2"/><text x="576" y="198" font-size="16" font-family="Georgia, serif" fill="#1c1420">🎭 Perverse</text><text x="576" y="228" font-size="13" fill="#3a3040" font-family="sans-serif">«structure»</text><text x="576" y="258" font-size="13" fill="#3a3040" font-family="sans-serif">scene / fetish</text><line x1="680" y1="160" x2="550" y2="120" stroke="#b68a3a" stroke-dasharray="4 4"/><rect x="820" y="160" width="240" height="140" rx="8" fill="#fff" stroke="#5a3d7a" stroke-width="2"/><text x="836" y="198" font-size="16" font-family="Georgia, serif" fill="#1c1420">⚡ Psychotic</text><text x="836" y="228" font-size="13" fill="#3a3040" font-family="sans-serif">«structure»</text><text x="836" y="258" font-size="13" fill="#3a3040" font-family="sans-serif">homemade order</text><line x1="940" y1="160" x2="550" y2="120" stroke="#b68a3a" stroke-dasharray="4 4"/>
